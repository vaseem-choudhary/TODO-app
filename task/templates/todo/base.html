<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Todo App{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Messages -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Top Auth Bar -->
    <div class="container mt-3">
        {% if user.is_authenticated %}
            <div class="d-flex justify-content-between align-items-center">
                <span>Logged in as <strong>{{ user.username }}</strong></span>
                <a class="btn btn-outline-danger btn-sm" href="{% url 'task:logout' %}">Logout</a>
            </div>
        {% else %}
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-primary btn-sm" href="{% url 'task:login' %}">Login</a>
                <a class="btn btn-outline-success btn-sm" href="{% url 'task:register' %}">Register</a>
            </div>
        {% endif %}
    </div>

    <hr>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'task:task_list' %}"> Todo App</a>
            <a class="btn btn-primary" href="{% url 'task:task_create' %}">+ Add Task</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mb-5">
        {% block content %}
        <!-- Child templates render here -->
        {% endblock %}
    </div>

</body>
</html>
