{% extends 'todo/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h3 class="mb-0 fw-bold">
                        {% if task %}
                            Edit Task
                        {% else %}
                            Add Task
                        {% endif %}
                    </h3>
                    <span class="badge bg-primary-subtle text-primary px-3 py-2">
                        Todo App
                    </span>
                </div>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Title</label>
                        <input type="text" name="title" class="form-control form-control-lg" value="{{ task_title }}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Description</label>
                        <textarea name="description" rows="4" class="form-control">{{ task.description }}</textarea>
                    </div>

                    {% if task %}
                    <div class="form-check form-switch mb-4">
                        <input type="checkbox" name="completed" class="form-check-input" {% if completed %}checked{% endif %}>
                        <label class="form-check-label fw-semibold text-secondary">Completed</label>
                    </div>
                    {% endif %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg px-4">
                            {% if task %}Update{% else %}Save{% endif %}
                        </button>
                        <a href="{% url 'task:task_list' %}" class="btn btn-outline-secondary btn-lg px-4">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
